name: cargo-semver-checks
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request: { paths: ['**/Cargo.toml'] }
  workflow_dispatch:
jobs:
  semver-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          # Compare this PR against the base branch (default `main`) instead of
          # `cargo semver-checks check-release`, which requires every crate to
          # be published on crates.io.  PhenoMCP's workspace crates
          # (`pheno-meilisearch`, `pheno-qdrant`, `phenotype-surrealdb`,
          # `pheno-ports`) are NOT published — see PR #144 failure:
          #   `error: no crates with library targets selected, nothing to semver-check`
          baseline-rev: origin/${{ github.base_ref }}
