name: cargo-machete
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push: { branches: [main], paths: ['Cargo.toml', '**/Cargo.toml'] }
  pull_request: { paths: ['Cargo.toml', '**/Cargo.toml'] }
  schedule: [{ cron: '47 6 * * 4' }]
  workflow_dispatch:
jobs:
  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # Pinned to a commit on `bnjbvr/cargo-machete@main` whose tree contains an
      # `action.yml`.  The previous SHA (964923f7ed...) dated 2021-12-01 pre-dates
      # the action.yml landing and triggered GH Actions' "Can't find 'action.yml'"
      # error (see PR #144 failure).  Updated 2026-06-19.
      - uses: bnjbvr/cargo-machete@f447148733f2e2d3d9f2a4e4ae2b88a9d11f6298
