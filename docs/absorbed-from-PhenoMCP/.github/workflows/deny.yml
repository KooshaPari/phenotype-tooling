name: Supply Chain Policy (cargo-deny + gomod)

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deny.yml'
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deny.yml'
  schedule:
    # Weekly Monday 09:00 UTC — pick up newly published advisories / license changes
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust — cargo-deny enforces license, ban, source, and advisory policy
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny (Rust)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@5bb39ff5d5a0e94dc9e2dc94eced0c6129743a57 # v-latest
        with:
          rust-version: stable
          arguments: --all-features check

  # ---------------------------------------------------------------------------
  # Go — gomod verify + go mod tidy diff check
  # (mirrors cargo-deny for the Go SDK under /go if present in the future)
  # ---------------------------------------------------------------------------
  gomod-check:
    name: gomod check (Go)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2

      - name: Install Go
        uses: actions/setup-go@7a3e6a83b96a74b5fbb1ee7e5fc74c448f647193 # v5.5.0
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck (advisories) if a Go module is present
        run: |
          if [ -f go.mod ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
          else
            echo "No go.mod at repo root; skipping govulncheck."
          fi

      - name: Verify go.sum integrity
        run: |
          if [ -f go.mod ]; then
            go mod verify
          else
            echo "No go.mod at repo root; skipping go mod verify."
          fi

      - name: Check go.mod / go.sum tidiness
        run: |
          if [ -f go.mod ]; then
            cp go.mod go.mod.bak
            cp go.sum go.sum.bak
            go mod tidy
            diff -u go.mod.bak go.mod && diff -u go.sum.bak go.sum
          else
            echo "No go.mod at repo root; skipping go mod tidy diff."
          fi