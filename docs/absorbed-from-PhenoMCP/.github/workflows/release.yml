name: Release

# Tier-0 hygiene: SHA-pinned actions, concurrency hardening, minimal permissions.
#
# This workflow builds the `pheno-mcp` binary on a `v*` tag push and
# publishes it as a GitHub Release with a CycloneDX SBOM attached.
# Provenance attestation lives in release-attest.yml; this workflow
# is the umbrella "ship a release" entry point.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release mid-flight

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry & target
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --bin pheno-mcp

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.7
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd0de8ccd5686b70862 # v4.6.0
        with:
          name: pheno-mcp-${{ github.event.inputs.version || github.ref_name }}
          path: |
            target/release/pheno-mcp
            sbom.cdx.json
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: pheno-mcp-${{ github.event.inputs.version || github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95f20ddfc40fe273f2e886b5d5cc2a201cb4b1d # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/pheno-mcp
            dist/sbom.cdx.json
