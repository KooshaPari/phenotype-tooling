name: Polyglot CI
on: [push, pull_request]
permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - run: cargo build

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # latest stable
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pytest-asyncio httpx
      - name: Run Python tests
        run: PYTHONPATH=python/src python -m pytest python/tests/ -q
