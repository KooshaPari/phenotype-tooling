# cargo-deny config for Metron
#
# Every advisory ignore below MUST carry a specific RUSTSEC ID and a concrete
# justification (per repo policy: no silent suppressions, no wildcard ignores).
# Re-evaluate on every dep bump and on each touch of this file.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
