[package]
name = "fastmcp-asset"
version = "0.1.0"
edition = "2024"
description = "MCP Asset handler for discovering, building, validating, and managing phenotype packs"
authors = ["KooshaPari"]
license = "MIT"
repository = "https://github.com/KooshaPari/PhenoFastMCP-rust"
rust-version = "1.85"

[dependencies]
fastmcp-rust = { path = "../fastmcp" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { version = "3.0", optional = true }
toml = { workspace = true }
walkdir = "2.5"
semver = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.0"
serde_json = { workspace = true }

[features]
default = ["tempfile"]
