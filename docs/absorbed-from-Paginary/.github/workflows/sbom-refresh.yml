name: Monthly SBOM Refresh

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-refresh:
    name: SBOM Refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Generate SBOM
        run: |
          if command -v cyclonedx-py &>/dev/null; then
            cyclonedx-py requirements -o sbom.json 2>/dev/null || true
          fi
          if command -v syft &>/dev/null; then
            syft . -o cyclonedx-json=sbom.json 2>/dev/null || true
          fi
          echo "SBOM generation attempted."
