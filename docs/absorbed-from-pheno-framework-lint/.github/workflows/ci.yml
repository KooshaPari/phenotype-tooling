name: ci

on:
  push:
    branches: [main, chore/**, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Byte-compile (syntax check)
        run: python -m py_compile pheno_framework_lint.py

      - name: Run smoke tests
        run: python -m unittest discover tests -v

      - name: pip-audit (zero-deps policy)
        run: |
          pip install pip-audit
          pip-audit --no-deps || echo "pip-audit found issues (informational; no deps)"
