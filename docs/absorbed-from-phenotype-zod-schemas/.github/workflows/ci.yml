name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install task runner
        uses: arduino/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint (biome)
        run: bunx biome check .

      - name: TypeScript type-check
        run: bunx tsc --noEmit

      - name: Vitest
        run: bunx vitest run

  build:
    name: Build ESM bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile || bun install
      - run: bunx tsc
      - name: Verify exports map
        run: |
          test -f dist/index.js && test -f dist/index.d.ts || (echo "build artifacts missing" && exit 1)

  secrets:
    name: TruffleHog secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extraArgs: --no-history
