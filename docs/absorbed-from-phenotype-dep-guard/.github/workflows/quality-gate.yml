name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable-quality-gate.yml@main
    with:
      stack: rust
      coverage-threshold: 85
      skip-coverage: false
