name: Reusable Dependency Guard

# Org-wide enforcement entrypoint. Any repo can wire dep-guard into its CI with:
#
#   jobs:
#     dep-guard:
#       uses: KooshaPari/phenotype-dep-guard/.github/workflows/reusable-dep-guard.yml@main
#       with:
#         fail-on: high   # none | high | any
#
# This runs `dep-guard scan` against the caller's checked-out tree and gates the
# job per `fail-on`, turning dep-guard from a standalone CLI into a federated
# governance check (see ADR / org governance federation).

on:
  workflow_call:
    inputs:
      path:
        description: 'Path within the caller repo to scan.'
        type: string
        required: false
        default: '.'
      fail-on:
        description: 'Severity gate: none (report-only) | high | any.'
        type: string
        required: false
        default: 'high'
      python-version:
        description: 'Python version used to run dep-guard.'
        type: string
        required: false
        default: '3.12'
      ref:
        description: 'Pin dep-guard to a ref (tag/sha) for reproducibility.'
        type: string
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  dep-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout phenotype-dep-guard
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: KooshaPari/phenotype-dep-guard
          ref: ${{ inputs.ref }}
          path: .phenotype-dep-guard

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dep-guard
        working-directory: .phenotype-dep-guard
        run: python -m pip install --upgrade pip && pip install .

      - name: Run dependency guard scan
        run: dep-guard scan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}"
