# ─────────────────────────────────────────────────────────────
# Security Scan — cargo-audit (Rust advisory DB)
# ─────────────────────────────────────────────────────────────
# Scans Cargo.lock against the RustSec Advisory Database for
# known vulnerabilities, unsound crates, and unmaintained deps.
#
# Runs alongside:
#   - audit.yml       → CodeQL (GitHub semantic analysis)
#   - deny.yml        → cargo-deny (licenses, bans, sources)
#   - ci.yml          → reusable Semgrep scan
#   - trufflehog.yml  → secrets detection
# ─────────────────────────────────────────────────────────────

name: Security Scan (cargo-audit)

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '30 3 * * 1'    # every Monday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the advisory DB so we don't re-clone every run.
      - name: Cache cargo-audit advisory DB
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            advisory-db-

      - name: Install cargo-audit
        uses: taiki-e/install-action@e75908a768da3e7a28ccaf3011aa18c8728c3992  # v2.49.0
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit
        continue-on-error: false

      # If vulnerabilities are found, file an issue (avoid spam by
      # only doing this on the scheduled run).
      - name: File issue on vulnerability
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['security'],
            });
            const alreadyOpen = issues.some(i =>
              i.title.includes('cargo-audit')
            );
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'cargo-audit: vulnerabilities detected',
                body: 'Scheduled cargo-audit detected security vulnerabilities. ' +
                      'Check the [Actions log](' +
                      `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ` +
                      'for details.',
                labels: ['security'],
              });
            }
