# ─────────────────────────────────────────────────────────────
# SBOM — CycloneDX (cargo-cyclonedx)
# ─────────────────────────────────────────────────────────────
# Generates a CycloneDX Software Bill of Materials from Rust
# dependencies on every release and weekly. Uploads it as a
# workflow artifact for downstream consumption (e.g. dependency
# track, grype, trivy).
# ─────────────────────────────────────────────────────────────

name: SBOM (CycloneDX)

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  release:
    types: [published]
  schedule:
    - cron: '0 5 * * 1'    # every Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sbom-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sbom-

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@e75908a768da3e7a28ccaf3011aa18c8728c3992  # v2.49.0
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --all --output-dir bom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f48907af11  # v4.6.2
        with:
          name: cyclonedx-sbom
          path: bom/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload SBOM to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: bom/*.json
          asset_name: phenoproc-cyclonedx-sbom.json
          asset_content_type: application/json
