name: Python CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${ github.workflow }-${ github.ref }
  cancel-in-progress: true
jobs:
  python:
    name: Python (pyright strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pyright
        run: python -m pip install --upgrade pip "pyright>=1.1.390"
      - name: Pyright (strict)
        run: python -m pyright
