# deny.toml — cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# NOTE: This is a forward-looking configuration. This repository is currently
# Python (pyproject.toml). The block below activates automatically the moment
# a Cargo.toml lands in the root. Until then `just deny` (and the deny.yml
# workflow) treat the project as a no-op.
#
# Pinning policy:
#   - licenses    : allow only permissive (MIT / Apache-2.0 / BSD-3-Clause …)
#   - bans        : block known-toxic crates (left-wasm-bindgen, ring, openssl)
#   - advisories  : fail on any unpatched RUSTSEC advisory
#   - sources     : only crates.io

[graph]
all-features = false

[advisories]
db-path        = "~/.cargo/advisory-db"
db-urls        = ["https://github.com/rustsec/advisory-db"]
yanked         = "warn"
ignore         = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
deny  = []
skip  = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
