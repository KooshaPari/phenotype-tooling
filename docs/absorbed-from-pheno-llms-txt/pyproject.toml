[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno-llms-txt"
version = "0.1.0"
description = "Generate llms.txt files for Phenotype repos (LLM-friendly README)."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "KooshaPari"}]
keywords = ["phenotype", "llms-txt", "ai-dd", "crutch", "vibecoding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6",
]

[project.scripts]
pheno-llms-txt = "pheno_llms_txt.cli:main"

[project.urls]
Homepage = "https://github.com/KooshaPari/pheno-llms-txt"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_llms_txt"]

[tool.hatch.build.targets.sdist]
include = ["src/pheno_llms_txt", "tests", "README.md", "CHANGELOG.md", "LICENSE-MIT", "AGENTS.md", "llms.txt"]
