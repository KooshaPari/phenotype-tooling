[package]
name = "authkit-core"
version = "0.1.0"
edition = "2021"
authors = ["Phenotype Team"]
description = "Authentication and authorization framework with multi-provider support (JWT, OAuth2, RBAC, ABAC)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AuthKit"
documentation = "https://docs.rs/authkit-core"
keywords = ["auth", "authentication", "authorization", "jwt", "oauth"]
categories = ["authentication", "web-programming"]
rust-version = "1.75"

[dependencies]
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
jsonwebtoken = { version = "10", features = ["use_pem"] }
argon2 = { workspace = true }
sha2 = { workspace = true }
base64 = "0.21"
rand = { workspace = true }
http = { workspace = true }
axum = { workspace = true }
tokio-postgres = "0.7"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
bcrypt = "0.19"
chacha20poly1305 = "0.10"
zeroize = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
rcgen = "0.14.7"
criterion = "0.8"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
