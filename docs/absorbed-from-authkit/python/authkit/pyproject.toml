[project]
name = "authkit"
version = "0.2.0"
description = "AuthKit Python SDK aggregator — re-exports pheno-auth, pheno-credentials, and pheno-security as a single import surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Phenotype Team", email = "team@kooshapari.com" },
]
dependencies = [
    "pheno-auth>=0.1.0",
    "pheno-credentials>=0.1.0",
    "pheno-security>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/KooshaPari/AuthKit"
Source = "https://github.com/KooshaPari/AuthKit/tree/main/python/authkit"
Issues = "https://github.com/KooshaPari/AuthKit/issues"
Canonical = "https://github.com/KooshaPari/phenotype-python-sdk/tree/main/packages/auth-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["__init__.py", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist]
include = ["__init__.py", "README.md", "pyproject.toml"]
