[workspace]
resolver = "2"
members = [
    "crates/authkit-core",
    "crates/phenotype-auth-contracts",
    "crates/phenotype-cipher",
    "crates/phenotype-crypto",
    "crates/phenotype-casbin-wrapper",
    "crates/telemetry-wrapper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Phenotype Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AuthKit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
rand = "0.10"
sha2 = "0.11"
base64 = "0.22"
http = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
zeroize = { version = "1.8", features = ["derive"] }
argon2 = "0.5"

[workspace.dependencies.phenotype-auth-contracts]
path = "crates/phenotype-auth-contracts"

[workspace.dependencies.phenotype-cipher]
path = "crates/phenotype-cipher"

[workspace.dependencies.phenotype-crypto]
path = "crates/phenotype-crypto"

[workspace.dependencies.phenotype-casbin-wrapper]
path = "crates/phenotype-casbin-wrapper"

[profile.release]
lto = true

[[bench]]
name = "auth"
harness = false

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "perf"
harness = false
