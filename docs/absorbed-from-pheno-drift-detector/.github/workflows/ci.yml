name: ci

on:
  push:
    branches: [main, chore/**, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run smoke tests
        run: |
          python -m unittest discover tests -v

      - name: pip-audit (supply chain)
        run: |
          pip install pip-audit
          pip-audit --no-deps || echo "pip-audit found issues (informational; no deps)"

  lint:
    name: python -m py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all sources
        run: |
          python -m py_compile pheno_drift_detector.py
          python -m compileall -q tests/
