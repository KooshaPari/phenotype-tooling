[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno-cost-card"
version = "0.1.0"
description = "Per-repo and fleet cost card for CI minutes, LLM token spend, and storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Phenotype" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_cost_card"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
