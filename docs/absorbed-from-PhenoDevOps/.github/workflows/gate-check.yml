on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: Gate Check



jobs:
  gate-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LANGUAGE: ${{ inputs.language }}
      CHANNEL: ${{ inputs.channel }}
      RISK_PROFILE: ${{ inputs.risk_profile }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151

      - name: Run lint
        run: mise run lint
        continue-on-error: false

      - name: Run test
        run: mise run test
        continue-on-error: false

      - name: Run security audit
        if: ${{ inputs.channel == 'beta' || inputs.channel == 'stable' || inputs.risk_profile == 'high' }}
        run: mise run audit
        continue-on-error: false

      - name: Gate check result
        run: |
          echo "✓ Gate check passed for $LANGUAGE"
          echo "  Channel: $CHANNEL"
          echo "  Risk profile: $RISK_PROFILE"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

