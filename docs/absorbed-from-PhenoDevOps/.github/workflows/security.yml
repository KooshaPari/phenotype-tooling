name: Security

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2am UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Cargo Audit ──────────────────────────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ github.token }}

  # ─── Cargo Deny ───────────────────────────────────────────────────────
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v-latest
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories, licenses, duplicates
        run: cargo deny check

  # ─── Gitleaks Secret Detection ────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─── CodeQL SAST ──────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [cpp, python]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: github/codeql-action/init@0daab03d71ff584ef619d027a3fd9146679c5d84
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@0daab03d71ff584ef619d027a3fd9146679c5d84

  # ─── Python Security (bandit) ─────────────────────────────────────────
  python-security:
    name: Python Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
        with:
          python-version: "3.14"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        run: bandit -r python/src -ll
        continue-on-error: true

  # ─── OSV-Scanner (Rust lockfile; repo does not commit Cargo.lock) ───────
  osv-scanner:
    name: OSV Scanner (Cargo.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v-latest
      - name: Generate Cargo.lock for scanning
        run: cargo generate-lockfile
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.3.5
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: OSV-Scanner (SARIF for Code Scanning)
        id: osv
        run: osv-scanner scan -L Cargo.lock --format sarif --output-file osv-results.sarif
      - name: Upload OSV SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84
        with:
          sarif_file: osv-results.sarif
          category: osv-cargo-lock
      - name: OSV table (on vulnerability findings)
        if: failure() && steps.osv.outcome == 'failure'
        run: osv-scanner scan -L Cargo.lock --format table
