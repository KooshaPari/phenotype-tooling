on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


name: Sync Canary



permissions:
  contents: write

concurrency:
  group: agileplus-sync-canary
  cancel-in-progress: false

jobs:
  sync-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "agileplus-bot"
          git config user.email "agileplus-bot@users.noreply.github.com"

      - name: Prepare local canary ref
        run: |
          git fetch origin canary:canary || git branch canary origin/canary

      - name: Sync canary from main
        run: cargo run -p agileplus-cli --locked -- branch:sync --source main --target canary

      - name: Push canary
        run: git push origin canary
