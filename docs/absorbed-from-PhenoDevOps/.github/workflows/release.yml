on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


name: Release



permissions:
  contents: write

concurrency:
  group: agileplus-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate-check:
    timeout-minutes: 10
    uses: ./.github/workflows/gate-check.yml
    with:
      language: ${{ inputs.language }}
      channel: ${{ inputs.channel }}
      risk_profile: high

  # ─── CycloneDX SBOMs (attached to GitHub Release with binaries) ───────
  cyclonedx-sboms:
    name: CycloneDX SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v-latest

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate workspace SBOMs
        run: bash scripts/ci/generate-workspace-sboms.sh . sbom-out

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v-latest
        with:
          name: cyclonedx-sbom-workspace
          path: sbom-out/cyclonedx-sbom-*.json
          if-no-files-found: error
          retention-days: 5

  # ─── Syft SPDX (complements CycloneDX per-crate JSON) ─────────────────
  syft-spdx:
    name: Syft SPDX (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Install Syft
        env:
          SYFT_SEMVER: 1.42.3
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_SEMVER}/syft_${SYFT_SEMVER}_linux_amd64.tar.gz" | tar xz
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SPDX JSON (repo tree)
        run: |
          mkdir -p sbom-out
          syft . \
            -o spdx-json=sbom-out/syft-spdx-workspace.json \
            --exclude './target/**' \
            --exclude './docs/**' \
            --exclude './**/.venv/**' \
            --exclude './**/node_modules/**' \
            --exclude './.git/**'

      - name: Upload SPDX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v-latest
        with:
          name: syft-spdx-workspace
          path: sbom-out/syft-spdx-workspace.json
          if-no-files-found: error
          retention-days: 5

  # ─── Create GitHub Release ────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - build-release
      - cyclonedx-sboms
      - syft-spdx
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ./binaries
      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          for target_dir in ./binaries/*/; do
            target_name=$(basename "$target_dir")
            binary_path="$target_dir/agileplus"
            if [ -f "$binary_path" ]; then
              cp "$binary_path" "./release-assets/agileplus-${target_name}"
            fi
          done
          sbom_dir="./binaries/cyclonedx-sbom-workspace"
          if [ -d "$sbom_dir" ]; then
            shopt -s nullglob
            for f in "$sbom_dir"/cyclonedx-sbom-*.json; do
              cp "$f" ./release-assets/
            done
            shopt -u nullglob
          fi
          syft_dir="./binaries/syft-spdx-workspace"
          if [ -d "$syft_dir" ]; then
            for f in "$syft_dir"/*.json; do
              [ -f "$f" ] && cp "$f" ./release-assets/
            done
          fi
      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: "./release-assets/*"
          token: ${{ github.token }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          # Re-runs / human-edited releases: keep title & body; still refresh assets list.
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
