on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: workflow-permissions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write
