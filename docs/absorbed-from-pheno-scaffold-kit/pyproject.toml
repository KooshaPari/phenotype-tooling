[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.390"]

[project]
name = "pheno-scaffold-kit"
version = "0.1.0"
description = "Umbrella scaffold CLI for Phenotype repo setup tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Phenotype" }
]
maintainers = [
  { name = "Phenotype" }
]
keywords = [
  "scaffold",
  "cli",
  "phenotype",
  "project-initialization",
  "boilerplate",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "click",
]

[project.urls]
repository = "https://github.com/KooshaPari/pheno-scaffold-kit"
documentation = "https://github.com/KooshaPari/pheno-scaffold-kit"
changelog = "https://github.com/KooshaPari/pheno-scaffold-kit/blob/main/CHANGELOG.md"

[project.scripts]
pheno-scaffold = "pheno_scaffold_kit.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_scaffold_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
