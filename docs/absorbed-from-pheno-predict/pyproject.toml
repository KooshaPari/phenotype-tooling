[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheno-predict"
version = "0.1.0"
description = "Fleet-wide similar-code scanner for predictive DRY (ADR-041, L72)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KooshaPari", email = "koosha@kooshapari.com"},
]
keywords = ["pheno", "predict", "dry", "jaccard", "shingle", "governance", "l72"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Tools",
]

# No external runtime deps — stdlib only by design (see SPEC.md §"Why stdlib only").
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pip-audit>=2.6",
]

[project.scripts]
pheno-predict = "pheno_predict:main"

[project.urls]
Homepage = "https://github.com/KooshaPari/pheno-predict"
Issues = "https://github.com/KooshaPari/pheno-predict/issues"

[tool.setuptools]
py-modules = ["pheno_predict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
