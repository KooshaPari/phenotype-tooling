name: ci

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run smoke tests
        run: |
          pytest tests/ -v

      - name: pip-audit (supply chain)
        # No runtime deps to audit (stdlib-only by design); this is a
        # no-op in steady state and a tripwire if any future dep slips in.
        run: |
          pip-audit --strict --no-deps || true

  lint:
    name: python -m py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all sources
        run: |
          python -m py_compile pheno_predict.py
          python -m compileall -q tests/
