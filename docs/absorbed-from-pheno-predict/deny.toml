# deny.toml — pheno-predict
#
# `deny.toml` is a Rust-tooling convention (cargo-deny) and is not directly
# applicable to a Python stdlib-only project. This file exists to:
#   1. Signal that the question of supply-chain deny policy has been considered
#      (per ADR-023 Rule 3.1 substrate quality bar).
#   2. Point readers to the Python-equivalent policy file (`.safety-policy.yml`).
#   3. Reserve a stable filename for future migration to a Python supply-chain
#      tool that does use `deny.toml` as its config convention.
#
# If you intend to add Rust dependencies in the future, populate this file
# with the cargo-deny schema. For now, the Python supply-chain policy lives in
# `.safety-policy.yml` and is enforced via `pip-audit` in CI.

[graph]
# No Rust deps; this section is intentionally empty.
all-features = false

[advisories]
# N/A: no Rust deps.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
# N/A: no Rust deps.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# N/A: no Rust deps.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# N/A: no Rust deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
