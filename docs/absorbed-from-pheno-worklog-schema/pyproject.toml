[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.390"]

[project]
name = "pheno-worklog-schema"
version = "0.2.0"
description = "WORKLOG.md schema + validator for Phenotype repos (v2.1: device: column per ADR-015/ADR-023)."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "KooshaPari"}]
keywords = ["phenotype", "worklog", "schema", "ai-dd", "crutch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6",
    "click>=8.1",
]

[project.scripts]
pheno-worklog-validate = "pheno_worklog_schema.cli:validate_cmd"
pheno-worklog-emit = "pheno_worklog_schema.emit_jsonl:main"

[project.urls]
Homepage = "https://github.com/KooshaPari/pheno-worklog-schema"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_worklog_schema"]

[tool.hatch.build.targets.sdist]
include = ["src/pheno_worklog_schema", "tests", "README.md", "CHANGELOG.md", "LICENSE-MIT", "AGENTS.md", "llms.txt", "WORKLOG.md"]
