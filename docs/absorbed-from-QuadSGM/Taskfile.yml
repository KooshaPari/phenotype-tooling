version: "3"

tasks:
  default:
    desc: List common build, test, lint, and clean tasks
    cmds:
      - task --list

  build:
    aliases: [b]
    desc: Build detected repo language targets
    cmds:
      - python3 .taskfile/tasks.py build

  test:
    aliases: [t]
    desc: Test detected repo language targets
    cmds:
      - python3 .taskfile/tasks.py test

  lint:
    aliases: [l]
    desc: Lint detected repo language targets
    cmds:
      - python3 .taskfile/tasks.py lint

  clean:
    aliases: [c]
    desc: Remove common language and build artifacts
    cmds:
      - python3 .taskfile/tasks.py clean

  grade:
    desc: Full grade (strictest — no caching)
    cmds:
      - ./grade.sh

  grade-fast:
    desc: Fast grade (skips heavy checks)
    cmds:
      - ./grade.sh --fast

  grade-json:
    desc: Grade with JSON output
    cmds:
      - ./grade.sh --json

  grade-html:
    desc: Grade with HTML report
    cmds:
      - ./grade.sh --html

  install-lefthook:
    desc: Install lefthook git hooks
    cmds:
      - lefthook install
    status:
      - test -f .git/hooks/lefthook
