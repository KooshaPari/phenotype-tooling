[project]
name = "4sgm"
version = "0.1.0"
description = "4SGM - LangGraph + MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "langgraph>=0.0.50",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "fastmcp>=0.2.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    # Security: CVE-2026-40934, CVE-2026-40110, CVE-2026-35397, CVE-2025-61669 — jupyter-server path traversal, CORS bypass, cookie persistence, open redirect
    "jupyter-server>=2.18.0",
    # Security: CVE-2026-40171 — jupyterlab/notebook CommandLinker XSS token theft
    # NOTE: jupyterlab>=4.5.8 not yet released on PyPI (latest stable: 4.5.7).
    # Will auto-resolve when 4.5.8+ is published. Using --prerelease=allow in CI.
    "jupyterlab>=4.5.8",
    # Security fixes
    "python-multipart>=0.0.26",
    # Security: CVE-2026-42284, CVE-2026-42215 — gitpython command injection / unsafe option check
    "gitpython>=3.1.47",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
4sgm = "sgm_cli:main"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "ty>=0.0.2",
    "basedpyright>=1.12.0",
    "diskcache>=5.6.3",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "vulture>=2.11",
    "tach>=0.4.0",
    "mypy>=1.0.0",
]

[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["4sgm"]
include = ["backend*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_functions = [
    "test_*",
]
addopts = "-v"

[tool.uv]
override-dependencies = [
    "urllib3>=2.2.3",
    "mcp>=1.1.0",
    "fastmcp>=0.3.0",
    "httpx>=0.28.0",
]

[tool.black]
line-length = 100
target-version = [
    "py313",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "E501",
    "F821",
    "F811",
    "F401",
    "ANN",
    "E402",
]
select = [
    "E",
    "F",
    "W",
    "I",
]
