name: Auto Merge Gate
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  # FIXED: pull_request (not pull_request_target) — pull_request_target on auto-merge
  # is a CRITICAL supply chain risk: a labeled fork PR auto-merges fork code
  # into the base repo with write access to secrets. pull_request runs in the
  # fork's context with no access to base repo secrets.
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
  pull_request_review:
    types:
      - submitted
  pull-requests: write

jobs:
  enable-automerge:
    if: |
      (github.event_name != 'pull_request_review') ||
      (github.event.review.state == 'APPROVED')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for labeled PRs
        if: |
          contains(github.event.pull_request.labels.*.name, 'automerge') &&
          !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          github-token: ${{ github.token }}
          merge-method: squash
permissions:
  contents: read

