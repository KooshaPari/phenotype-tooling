name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Build Documentation Site
  # ============================================================================
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate docs structure
        run: |
          set -euo pipefail
          test -d docs
          test -f docs/index.md
          echo "Docs structure validated"

          # Count markdown files
          md_count=$(find docs -name "*.md" | wc -l)
          echo "Found $md_count markdown files in docs/"

      - name: Create simple static site
        run: |
          set -euo pipefail
          mkdir -p docs/.vitepress/dist

          # Write HTML file using printf
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <title>4sgm Documentation</title>' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <style>' \
            '    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }' \
            '    h1 { color: #333; }' \
            '    nav { margin: 20px 0; }' \
            '    nav a { margin-right: 15px; color: #0066cc; }' \
            '    .section { margin: 30px 0; padding: 20px; background: #f5f5f5; border-radius: 8px; }' \
            '  </style>' \
            '</head>' \
            '<body>' \
            '  <h1>4sgm Documentation</h1>' \
            '  <nav>' \
            '    <a href="#guides">Guides</a>' \
            '    <a href="#reference">Reference</a>' \
            '    <a href="#api">API</a>' \
            '  </nav>' \
            '' \
            '  <div class="section" id="guides">' \
            '    <h2>Guides</h2>' \
            '    <p>Getting started and how-to guides.</p>' \
            '  </div>' \
            '' \
            '  <div class="section" id="reference">' \
            '    <h2>Reference</h2>' \
            '    <p>API references and technical documentation.</p>' \
            '  </div>' \
            '' \
            '  <div class="section" id="api">' \
            '    <h2>API</h2>' \
            '    <p>API documentation and endpoints.</p>' \
            '  </div>' \
            '' \
            '  <footer style="margin-top: 50px; color: #666; font-size: 14px;">' \
            '    <p>Generated by 4sgm CI</p>' \
            '  </footer>' \
            '</body>' \
            '</html>' > docs/.vitepress/dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v-latest
        with:
          path: docs/.vitepress/dist

  # ============================================================================
  # Deploy to GitHub Pages
  # ============================================================================
  deploy:
    name: Deploy Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v-latest
