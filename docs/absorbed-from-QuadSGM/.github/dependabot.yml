version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/4sgm"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/4sgm/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/4sgm/mastra-service"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    directory: "/4sgm/backend"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    directory: "/4sgm/mcp_server"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
