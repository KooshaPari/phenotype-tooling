version: '3.8'

services:
  # FastMCP Server - 25+ e-commerce tools
  mcp-server:
    build:
      context: ./4sgm/mcp_server
      dockerfile: Dockerfile
    container_name: 4sgm-mcp-server
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - 4sgm-network
    restart: unless-stopped

  # FastAPI Backend with LangGraph Agent
  backend:
    build:
      context: ./4sgm/4sgm/backend
      dockerfile: Dockerfile
    container_name: 4sgm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/4sgm
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:3000/mcp
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    depends_on:
      mcp-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - 4sgm-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: 4sgm-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=4sgm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 4sgm-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: 4sgm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 4sgm-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  4sgm-network:
    driver: bridge
