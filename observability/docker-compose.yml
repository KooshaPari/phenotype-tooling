# Observability stack for `phenotype-cli`
#
# Spin up Prometheus + Grafana against a running `pt observability` server.
# Server defaults to bind 127.0.0.1:9090 — adjust `pt.bind` below if you've
# pointed the server elsewhere.

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: phenotype-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: phenotype-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana:/var/lib/grafana/dashboards:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboard-providers.yml:/etc/grafana/provisioning/dashboards/dashboard-providers.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Alertmanager is not enabled by default. To enable Slack/PagerDuty routing,
  # uncomment the block below AND add an `alerting:` section in
  # observability/prometheus/prometheus.yml pointing at alertmanager:9093.
  #
  # alertmanager:
  #   image: prom/alertmanager:v0.27.0
  #   container_name: phenotype-alertmanager
  #   command:
  #     - --config.file=/etc/alertmanager/alertmanager.yml
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  prometheus-data:
  grafana-data:
