name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller that adopts the phenoShared reusable Rust CI workflow.
# Pinned to HEAD SHA of KooshaPari/phenoShared@main until PR #85 merges and
# exposes `.github/workflows/reusable/ci.yml`. Once merged, re-pin to a tag
# (e.g. @v1) per the phenoShared release policy.
jobs:
  workflow-present:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "CI workflow dispatched"

  rust-ci:
    uses: KooshaPari/phenoShared/.github/workflows/reusable/ci.yml@5ed0e3bb2279610656755d3adb5403fba94a2bd2
    with:
      rust-versions: '["stable"]'
      path: "."
