name: bench

on:
  schedule:
    # Nightly at 03:00 UTC (after the dedupe at 02:00 UTC)
    - cron: "0 3 * * *"
  push:
    paths:
      - "crates/phenotype-diff/**"
      - "crates/temporal-grounding/**"
      - "scripts/bench_diff.py"
      - "scripts/bench_parse_criterion.py"
      - "BENCHMARKS.md"
      - ".github/workflows/ci-bench.yml"
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Regression threshold (percentage, e.g. 5)"
        required: false
        default: "5"
      baseline_ref:
        description: "Git ref to compare against (default: BENCHMARKS.md)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1. Run criterion across both bench crates and persist artifacts.
  # ---------------------------------------------------------------------
  bench-run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            bench-nightly-${{ runner.os }}-

      - name: cargo bench (phenotype-diff)
        working-directory: crates/phenotype-diff
        run: |
          mkdir -p ../../bench_artifacts
          # rustc's libtest bench runner emits plain-text bencher format
          # to stderr; capture both streams. The `--bench` flag forces
          # the bench harness to actually run (otherwise cargo skips it
          # when --no-run is used elsewhere).
          cargo bench --no-fail-fast -- \
            --output-format bencher \
            --bench \
            >  ../../bench_artifacts/phenotype-diff.txt \
            2> ../../bench_artifacts/phenotype-diff.err || true
        env:
          CARGO_TERM_COLOR: never

      - name: cargo bench (temporal-grounding)
        working-directory: crates/temporal-grounding
        run: |
          cargo bench --no-fail-fast -- \
            --output-format bencher \
            --bench \
            >  ../../bench_artifacts/temporal-grounding.txt \
            2> ../../bench_artifacts/temporal-grounding.err || true
        env:
          CARGO_TERM_COLOR: never

      - name: coalesce bench text output
        run: |
          # rustc's libtest bench writer emits to either stdout or stderr
          # depending on the runner; concatenate both so the parser sees
          # all rows regardless of which stream wrote them.
          for crate in phenotype-diff temporal-grounding; do
            cat bench_artifacts/${crate}.err 2>/dev/null >> bench_artifacts/${crate}.txt || true
          done
          ls -la bench_artifacts/

      - name: upload bench artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-artifacts
          path: bench_artifacts/

  # ---------------------------------------------------------------------
  # 2. Diff against BENCHMARKS.md, fail if any benchmark regressed by
  #    more than the threshold percentage.
  # ---------------------------------------------------------------------
  bench-diff:
    needs: bench-run
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bench-artifacts
          path: bench_artifacts/

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: parse bench output -> JSONL
        run: |
          set -euo pipefail
          : > bench_artifacts/current.jsonl
          for txt in bench_artifacts/*.txt; do
            [ -f "${txt}" ] || continue
            crate="$(basename "${txt}" .txt)"
            # Strip leading ".err" suffix if any (defensive; coalesce step
            # merges stderr back into the .txt file).
            crate="${crate%.err}"
            python scripts/bench_parse_criterion.py \
              "${txt}" \
              >> bench_artifacts/current.jsonl
          done
          echo "=== current.jsonl line count: $(wc -l < bench_artifacts/current.jsonl) ==="
          head -5 bench_artifacts/current.jsonl || true

      - name: bench diff vs baseline
        id: diff
        run: |
          set -euo pipefail
          THRESHOLD="${THRESHOLD_PCT:-5}"
          BASELINE_REF="${BASELINE_REF:-}"
          ARGS=("--threshold" "${THRESHOLD}")
          if [ -n "${BASELINE_REF}" ]; then
            ARGS+=("--baseline-ref" "${BASELINE_REF}")
          fi
          # Run diff and capture exit code separately so we can surface
          # it via $GITHUB_OUTPUT. The script returns 0 (clean),
          # 1 (regression), 2 (parse error), 3 (missing baseline).
          set +e
          python scripts/bench_diff.py \
            bench_artifacts/current.jsonl \
            "${ARGS[@]}" \
            --baseline "BENCHMARKS.md" \
            --report-out "bench_artifacts/regression-report.md"
          DIFF_EXIT=$?
          set -e
          echo "diff_exit=${DIFF_EXIT}" >> "$GITHUB_OUTPUT"
          echo "=== bench_diff.py exit: ${DIFF_EXIT} ==="
          # Exit 0 (clean) or 2 (parse error) is acceptable here; we let
          # the next step decide. Exit 1 (regression) is also allowed
          # through; the pr-comment step will surface the regression.
          if [ "${DIFF_EXIT}" -eq 3 ]; then
            echo "::error::baseline BENCHMARKS.md missing or unreadable"
            exit 3
          fi

      - name: upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-regression-report
          path: bench_artifacts/
