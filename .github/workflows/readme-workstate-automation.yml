name: README Work-state Auto-Generator

on:
  schedule:
    - cron: "31 6 * * *"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      state:
        description: Work-state label for the README header.
        required: false
        default: ACTIVE
      progress_percent:
        description: Progress percentage for the 10-block header bar.
        required: false
        default: "75"

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-work-state-header:
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/readme-workstate.yml@main
    with:
      readme_path: README.md
      state: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.state || 'ACTIVE' }}
      progress_percent: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.progress_percent) || 75 }}
      do_push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      commit_message: chore(readme): refresh work-state header
      allow_fork_push: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
