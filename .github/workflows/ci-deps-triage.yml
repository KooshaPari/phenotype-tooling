name: Deps Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Cargo.lock"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
      - "**/go.sum"
      - ".github/dependabot.yml"

permissions:
  pull-requests: write
  contents: read
  security-events: read

jobs:
  label:
    name: Severity / ecosystem label attach
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Detect ecosystem
        id: eco
        run: |
          files="${{ github.event.pull_request.changed_files }}"
          if echo "$files" | grep -q "Cargo.lock"; then echo "ecosystem=cargo" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -Eq "package-lock.json|yarn.lock|pnpm-lock.yaml"; then echo "ecosystem=npm" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -q ".github/workflows"; then echo "ecosystem=github-actions" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -q "Dockerfile"; then echo "ecosystem=docker" >> "$GITHUB_OUTPUT"; fi
          if [ -z "${{ steps.eco.outputs.ecosystem }}" ]; then echo "ecosystem=other" >> "$GITHUB_OUTPUT"; fi
      - name: Apply labels
        uses: actions/github-script@v9
        with:
          script: |
            const eco = '${{ steps.eco.outputs.ecosystem }}';
            const labels = [eco, 'phase3:wp06'];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels
            });
  cargo-audit:
    name: cargo audit reachable probe
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.changed_files, 'Cargo.lock') }}
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/rustup-action@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --deny warnings
  weekly-recheck:
    name: Nightly P0 recheck
    # No triggers schedules by design; see ADR-042.
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "P0 escalation handled separately; see wp06 docs."
