name: slo-backlog

# WP-13: SLO-driven backlog.
#
# Polls the Prometheus /api/v1/alerts endpoint every 10 minutes and emits a
# GitHub issue for each newly-firing burn-rate alert owned by this repo.
# Issues are deduped via the [fp=<12hex>] suffix in the title.
#
# Trigger:
#   - workflow_dispatch: manual run with optional inputs
# NOTE: schedule disabled 2026-08-19 — GitHub Actions runners cannot reach
# Prometheus at 127.0.0.1:9090. Re-enable once a reachable endpoint is
# configured in the deploy target.

on:
  workflow_dispatch:
    inputs:
      prometheus_url:
        description: 'Prometheus base URL'
        required: false
        default: ''
      dry_run:
        description: 'Print planned issues without opening them'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: slo-backlog
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gh CLI
        run: |
          type gh >/dev/null 2>&1 || (type apt-get >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y gh)
          gh --version

      - name: Run SLO backlog emitter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMETHEUS_URL: ${{ inputs.prometheus_url }}
        run: |
          set -euo pipefail
          if [ -z "$PROMETHEUS_URL" ]; then
            echo "slo-backlog: PROMETHEUS_URL is empty; skipping (configure via workflow_dispatch input)"
            exit 0
          fi
          args=(--prometheus-url "$PROMETHEUS_URL" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/slo_backlog.py "${args[@]}"