name: SBOM diff policy + dep license check

# WP-22 entrypoint. Compares the SBOM generated for the PR against
# the SBOM generated for main, surfaces any newly-introduced package
# with HIGH/CRITICAL vulnerabilities, and blocks merge if any are
# found.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  sbom-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build PR SBOM
        run: |
          cargo run -q -p sbom-gen -- --output sbom.head.json --format cyclonedx-json

      - name: Fetch base SBOM
        run: |
          gh api repos/${{ github.repository }}/contents/crates/sbom-gen/docs/security/sbom.json?ref=${{ github.base_ref }} \
            --jq '.content' | base64 -d > sbom.base.json

      - name: Run SBOM diff
        id: diff
        run: |
          python scripts/sbom_diff.py \
            --base sbom.base.json \
            --head sbom.head.json \
            --ecosystem crates.io \
            --report-path sbom-diff-report.md
          echo "EXIT=$?" >> "$GITHUB_ENV"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('sbom-diff-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-diff
          path: |
            sbom.head.json
            sbom.base.json
            sbom-diff-report.md

      - name: Fail build if findings
        if: env.EXIT != '0'
        run: |
          echo "::error::SBOM diff found HIGH/CRITICAL vulnerabilities in newly-added dependencies."
          echo "See sbom-diff-report.md for details."
          exit 1

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run license check
        run: |
          cargo deny --workspace check licenses \
            --config-path deny.toml \
            --hide-inclusion-graph 2>&1 | tee license-check.log