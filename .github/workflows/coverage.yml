# WP-17 coverage gate.
# Runs cargo-llvm-cov on every push to main + every PR targeting main.
# Reads thresholds from coverage.toml.
# Required check in branch-protection/main.json: coverage / line.
name: coverage

on:
  push:
    branches: [main, 'feat/wp17-coverage', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; cargo-llvm-cov 0.6 is the current stable.
  RUST_VERSION: '1.82.0'
  LLVM_VERSION: '18'

jobs:
  line:
    name: line coverage (workspace)
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: install Rust-src (for sysroot coverage)
        run: rustup component add rust-src

      - name: workspace clean
        run: cargo clean

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace --no-fail-fast

      - name: cargo llvm-cov (line coverage)
        run: |
          set -euo pipefail
          IGNORE_REGEX='(^|/)crates/.*/(tests|benches)/|(^|/)crates/ptx/src/main.rs$|(^|/)crates/.*/src/bin/'
          cargo llvm-cov --workspace --all-features --ignore-filename-regex "$IGNORE_REGEX" --lcov --output-path lcov-workspace.info
          cargo llvm-cov report --ignore-filename-regex "$IGNORE_REGEX" --json > coverage-workspace.json

      - name: parse coverage.json + check threshold
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Read thresholds from coverage.toml (single source of truth)
            const tomlRaw = fs.readFileSync('coverage.toml', 'utf8');
            const lineMin = parseFloat((tomlRaw.match(/line_coverage_min\s*=\s*([0-9.]+)/) || [])[1] || '80');
            const criticalMin = parseFloat((tomlRaw.match(/critical_coverage_min\s*=\s*([0-9.]+)/) || [])[1] || '90');
            const criticalMatch = tomlRaw.match(/critical_crates\s*=\s*\[(.*?)\]/s);
            const criticalCrates = criticalMatch
              ? criticalMatch[1].split(',').map(s => s.trim().replace(/["']/g, '')).filter(Boolean)
              : [];

            const coverage = JSON.parse(fs.readFileSync('coverage-workspace.json', 'utf8'));
            const data = coverage.data || [];
            const workspaceData = data.find(d => d.name === 'Workspace') || data[0];
            const workspaceRate = workspaceData?.totals?.lines?.percent;
            const lines = [`### line coverage`, `* threshold: ${lineMin}%`];
            if (typeof workspaceRate !== 'undefined') {
              lines.push(`* workspace: ${workspaceRate.toFixed(2)}%`);
              if (workspaceRate < lineMin) lines.push(':x: BELOW THRESHOLD');
              else lines.push(':white_check_mark: pass');
            }
            data
              .filter(d => d.name !== 'Workspace')
              .sort((a, b) => (b.totals?.lines?.percent ?? 0) - (a.totals?.lines?.percent ?? 0))
              .forEach(d => {
                const pct = d.totals?.lines?.percent;
                if (typeof pct !== 'undefined') {
                  lines.push(`* \`${d.name}\`: ${pct.toFixed(2)}%`);
                }
              });
            fs.writeFileSync('coverage-summary.md', lines.join('\n'));
            core.setOutput('summary', lines.join('\n'));
            core.setOutput('workspace_rate', String(workspaceRate ?? 0));
            core.setOutput('fail_under', String(lineMin));
            core.setOutput('critical_min', String(criticalMin));
            core.setOutput('critical_crates', JSON.stringify(criticalCrates));

      - name: summary
        run: cat coverage-summary.md

      - name: check workspace threshold
        env:
          RATE: ${{ steps.parse.outputs.workspace_rate }}
          FAIL: ${{ steps.parse.outputs.fail_under }}
        run: |
          set -euo pipefail
          python3 - <<PY
          rate = float("${RATE}")
          fail = float("${FAIL}")
          if rate < fail:
              print(f'::error::workspace line coverage {rate:.2f}% < fail-under {fail}%')
              raise SystemExit(1)
          print(f'workspace line coverage {rate:.2f}% >= {fail}%, OK')
          PY

      - name: upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov-workspace.info
          retention-days: 30

      - name: upload html
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 30
          if-no-files-found: error

  critical:
    name: critical-crate coverage
    needs: line
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: critical crates
        env:
          THRESHOLD: '90.0'
        shell: bash
        run: |
          set -euo pipefail
          for crate in phenotype-cli phenotype-config phenotype-diff phenotype-tooling-observability ptx; do
            IGNORE_REGEX='(^|/)crates/.*/(tests|benches)/|(^|/)crates/ptx/src/main.rs$|(^|/)crates/.*/src/bin/'
            cargo llvm-cov --package "$crate" --no-default-features --ignore-filename-regex "$IGNORE_REGEX" --json --output-path "lcov-$crate.info" || true
            cargo llvm-cov report --package "$crate" --ignore-filename-regex "$IGNORE_REGEX" --json > "coverage-$crate.json"
            rate=$(python3 - "$crate" <<'PY'
import json
import sys

data = json.load(open(f"coverage-{sys.argv[1]}.json")).get("data", [])
record = next((item for item in data if item.get("name") == "Workspace"), data[0] if data else {})
percent = record.get("totals", {}).get("lines", {}).get("percent", 0.0)
print(f"{percent:.2f}")
PY
            )
            echo "$crate: $rate%"
            if python3 -c "import sys; sys.exit(0 if float('$rate') >= float('$THRESHOLD') else 1)"; then
              echo "  PASS (>= $THRESHOLD%)"
            else
              echo "::error::$crate line coverage $rate% < $THRESHOLD%"
              exit 1
            fi
          done
