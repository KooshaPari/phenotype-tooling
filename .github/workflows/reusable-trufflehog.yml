# Reusable secret scan — call from consumer repos:
#   jobs:
#     trufflehog:
#       uses: KooshaPari/phenotype-tooling/.github/workflows/reusable-trufflehog.yml@main
name: Reusable TruffleHog Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          path: ./
          base_depth: 1
          only_verified: true
