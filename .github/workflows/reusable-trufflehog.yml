# Reusable secret scan — call from consumer repos:
#   jobs:
#     trufflehog:
#       uses: KooshaPari/phenotype-tooling/.github/workflows/reusable-trufflehog.yml@main
name: Reusable TruffleHog Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ./
          base_depth: 1
          only_verified: true
