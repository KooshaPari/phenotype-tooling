name: stream-compat

on:
    pull_request:
        branches: [main]
        paths:
            - ".github/cross-stream-dependencies.json"
            - "workspace.metadata.toml"
            - "crates/phenotype-cli/src/lib.rs"
            - "crates/phenotype-cli/src/workspace/**"
            - "crates/phenotype-cli/src/observability/**"
            - "crates/phenotype-cli/src/deploy.rs"
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            core_version:
                description: "core-stream version to pin against (default: last 3 minors)"
                required: false
                default: ""

# WP-30: assert that downstream streams keep working when core-stream is
# pinned at N, N-1, N-2. Runs the matrix runner script which:
#   1. Reads .github/cross-stream-dependencies.json (WP-26).
#   2. Builds cli-stream + ops-stream with core-stream pinned at the
#      three previous minor versions.
#   3. Invokes `cargo test --test stream_compat` for each combination.
#   4. Aggregates pass/fail into a markdown PR-comment + a manifest.json.
# Non-current core-stream versions that fail any cross-stream test block
# the PR via the required stream-compat check on branch-protection/main.json.

permissions:
    contents: read
    pull-requests: write

env:
    RUSTFLAGS: -D warnings

jobs:
    matrix:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                core_version: ["current", "previous-1", "previous-2"]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: Swatinem/rust-cache@v2

            - name: Resolve cargo metadata
              shell: bash
              env:
                  MATRIX_CORE_VERSION: ${{ matrix.core_version }}
              run: |
                  set -euo pipefail
                  cargo metadata --format-version 1 --no-deps > cargo-meta.json
                  echo "::notice::Testing stream compatibility label ${MATRIX_CORE_VERSION}"

            - name: Run stream-compat matrix
              shell: bash
              env:
                  MATRIX_CORE_VERSION: ${{ matrix.core_version }}
              run: |
                  set -euo pipefail
                  python3 scripts/stream_compat_matrix.py \
                    --channel-manifest .github/channel-manifest.json \
                    --dep-graph .github/cross-stream-dependencies.json \
                    --output-dir "stream-compat-${MATRIX_CORE_VERSION}"
                  jq -e '.summary.fail == 0 and .summary.error == 0' \
                    "stream-compat-${MATRIX_CORE_VERSION}/matrix.json"

            - name: Upload matrix report
              uses: actions/upload-artifact@v4
              with:
                  name: stream-compat-${{ matrix.core_version }}-report
                  path: |
                      stream-compat-${{ matrix.core_version }}/matrix.json
                      stream-compat-${{ matrix.core_version }}/matrix.md

            - name: PR comment
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: stream-compat-${{ matrix.core_version }}
                  path: stream-compat-${{ matrix.core_version }}.md

    summary:
        if: always()
        needs: [matrix]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Download matrix reports
              uses: actions/download-artifact@v4
              with:
                  pattern: stream-compat-*-report
                  path: reports
                  merge-multiple: false
            - name: Aggregate matrix results
              shell: bash
              run: |
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  reports = sorted(Path("reports").glob("*/stream-compat-*/matrix.json"))
                  lines = ["# Stream compatibility summary", "", "| Report | Pass | Fail | Error |", "|---|---:|---:|---:|"]
                  failed = False
                  for path in reports:
                      summary = json.loads(path.read_text())["summary"]
                      failed |= summary.get("fail", 0) or summary.get("error", 0)
                      lines.append(f"| {path.parent.name} | {summary.get('pass', 0)} | {summary.get('fail', 0)} | {summary.get('error', 0)} |")
                  Path("stream-compat-summary.md").write_text("\n".join(lines) + "\n")
                  if not reports:
                      raise SystemExit("no stream compatibility reports downloaded")
                  if failed:
                      raise SystemExit("stream compatibility failures detected")
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: stream-compat-summary
                  path: stream-compat-summary.md
            - name: Fail PR on any combination breach
              if: needs.matrix.result != 'success'
              run: |
                  echo "::error::stream-compat matrix failed for at least one core-stream version"
                  cat stream-compat-summary.md
                  exit 1
