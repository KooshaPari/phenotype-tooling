# Phenotype tooling workspace metadata.
#
# WP-25: 3 release streams drive 3 release-please packages.
# Each release-group corresponds to one release-stream.
# Crates that share a release-stream share a version.

[workspace.metadata.release-groups.core]
members = [
  "phenotype-config",
  "phenotype-diff",
  "phenotype-ontology",
  "phenotype-pdk",
  "phenotype-platform",
  "phenotype-resilience",
  "phenotype-service-registry",
  "pheno-tracing-stub",
  "pheno-type-stub",
  "pheno-rules",
  "dag-scheduler",
  "agent-orchestrator",
  "agent-forecast",
  "anthropic-usage-poll",
  "byteport",
  "heliosbench",
  "nanovms",
  "policystack",
  "policy-engine",
  "perf",
  "absorb-kits",
  "pheno-mcp",
  "pheno-mcp-router",
  "pheno-port-adapter",
  "pheno-events",
  "pheno-otel",
  "phenodag",
  "portage",
  "absorb",
]
bump = "minor"

[workspace.metadata.release-groups.cli]
members = [
  "phenotype-cli",
  "acceptance-contract",
  "audit-implementation",
  "audit-privacy",
  "bench-guard",
  "commit-msg-check",
  "doc-link-check",
  "docs-health",
  "fr-coverage",
  "fr-trace",
  "legacy-scan",
  "quality-gate",
  "release-cut",
  "worktree-manager",
  "hook-entry",
]
bump = "minor"

[workspace.metadata.release-groups.ops]
members = [
  "phenotype-tooling-observability",
  "fuzz-setup",
  "perfharness",
  "ptx",
  "sbom-gen",
]
bump = "minor"

[workspace.metadata.release-streams.core]
groups = ["core"]
description = "Domain crates + absorbed monoliths. Single semver."

[workspace.metadata.release-streams.cli]
groups = ["cli"]
description = "CLI facade + governance/audit/quality-gate tooling."

[workspace.metadata.release-streams.ops]
groups = ["observability", "release"]
description = "Observability + release tooling (SBOM, ptx, fuzz)."
