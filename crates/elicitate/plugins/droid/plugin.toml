# elicitate plugin for factory droid
# Installs via: droid mcp add elicitate_mcp -- elicitate-mcp
# Plus the skill manifest at ~/.factory/skills-dir/elicitate/

[meta]
name = "elicitate"
version = "0.9.0"
agent = "factory-droid"
description = "Native form-popup MCP tool for forgecode/claude/codex/cursor/droid/kilo. CLI + tray + daemon + 154 tests."

[skill]
source = "../../.elicitate/skills/elicitate/SKILL.md"
install_path = "~/.factory/skills-dir/elicitate/SKILL.md"

[mcp]
command = "elicitate-mcp"
args = ["--shutdown-timeout-secs", "5"]
install_cmd = "droid mcp add elicitate_mcp -- elicitate-mcp"

[discovery]
binary = "elicitate-mcp"
config_dir = "~/.factory"
notes = "Factory droid uses ~/.factory/mcp.json (symlink target). Skill installs at ~/.factory/skills-dir/elicitate/."

[verify]
# Use 'droid mcp list' to confirm elicitate_mcp is on the MCP server list.
cmd = "droid mcp list | grep elicitate_mcp"
expected = "elicitate_mcp"
