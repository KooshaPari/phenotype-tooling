[package]
name = "elicitate"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native OS popup elicitation tool — Rust library + CLI + MCP server"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
readme = "README.md"
keywords = ["phenotype", "elicitation", "mcp", "popup", "agent-ux"]
categories = ["command-line-utilities", "gui", "development-tools"]
publish = false

[lib]
name = "elicitate"
path = "src/lib.rs"

[[bin]]
name = "elicitate"
path = "src/bin_elicitate.rs"

[[bin]]
name = "elicitate-mcp"
path = "src/bin_mcp.rs"
required-features = ["mcp"]

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
schemars = "0.8"
crossbeam-channel = "0.5"
rmcp = { version = "0.2", features = ["server", "transport-io", "macros"], optional = true }

# v0.11.0: default KDF hardened from HKDF-SHA256 to `argon2id`
# (OWASP 2024 params: m=19 MiB, t=2, p=1). Legacy `hkdf-sha256`
# envelopes remain decryptable for forward compatibility on
# existing on-disk data (covers v0.10.0 and earlier).
# AES-256-GCM (AEAD) for the encryption layer.
# Pure-Rust, no_std-friendly, MSRV 1.75 — the workspace floor.
aes-gcm = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "std"] }
hkdf = { version = "0.12", features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
inquire = { version = "0.9", features = ["date"] }
which = "8"
phenotype-tooling-observability = { path = "../phenotype-tooling-observability", default-features = false, optional = true }
prometheus = { version = "0.14", optional = true }

# FFI for native tray — only compiled when the `tray-native` feature is on.
# tray-icon handles its own platform backends; the objc2/windows-sys crates
# here are for the badge-text and message-pump extras that tray-icon does not
# expose directly.
tray-icon = { version = "0.24", optional = true, default-features = false }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false }
objc2-foundation = { version = "0.3", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# TUI inbox viewer (v0.5.0). ratatui is no_std + needs explicit backend feature;
# ratatui-crossterm is selected because it works over the same crossterm backend
# we've already pulled in for signal handling.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color"] }
ratatui-crossterm = { version = "0.1", features = ["crossterm_0_29"] }
crossterm = "0.29"

[features]
default = ["mcp"]
observability = ["dep:phenotype-tooling-observability", "dep:prometheus"]
mcp = ["dep:rmcp"]
# Real OS tray icon (NSStatusItem on mac, Shell_NotifyIcon on win,
# libappindicator on linux) with badge counts and menu. Off by default
# because it pulls platform-specific dependencies and only makes sense
# when running `elicitate daemon` interactively.
tray-native = [
    "dep:tray-icon",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:windows-sys",
]

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
predicates = "3.1"
dirs = "5"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unsafe_code = "forbid"
