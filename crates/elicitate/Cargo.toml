[package]
name = "elicitate"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native OS popup elicitation tool — Rust library + CLI + MCP server"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
readme = "README.md"
keywords = ["phenotype", "elicitation", "mcp", "popup", "agent-ux"]
categories = ["command-line-utilities", "gui", "development-tools"]
publish = false

[lib]
name = "elicitate"
path = "src/lib.rs"

[[bin]]
name = "elicitate"
path = "src/bin_elicitate.rs"

[[bin]]
name = "elicitate-mcp"
path = "src/bin_mcp.rs"
required-features = ["mcp"]

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
schemars = "0.8"
rmcp = { version = "1.4", features = ["server", "transport-io", "macros"], optional = true }
inquire = { version = "0.7", features = ["date"] }
which = "6"
phenotype-tooling-observability = { path = "../phenotype-tooling-observability", default-features = false, optional = true }
prometheus = { version = "0.14", optional = true }

[features]
default = ["mcp"]
observability = ["dep:phenotype-tooling-observability", "dep:prometheus"]
mcp = ["dep:rmcp"]

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
predicates = "3.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unsafe_code = "forbid"
