# Forge plugin manifest for elicitate.
#
# This repo-root copy keeps the cross-client smoke test aligned with the
# installed host-repo layout that Forgecode expects.

[plugin]
name = "elicitate"
version = "0.1.0"
description = "Native OS popup elicitation tool — pause the agent and ask the human a structured question"
author = "Phenotype Contributors"
license = "MIT"
homepage = "https://github.com/KooshaPari/phenotype-tooling/tree/main/crates/elicitate"

[skill]
path = "../../.elicitate/skills/elicitate/SKILL.md"
auto_load = true
register_name = "elicitate"

# MCP server registration — Forge discovers this on next launch.
[[mcp_servers]]
name = "elicitate_mcp"
command = "elicitate-mcp"
args = ["serve"]
transport = "stdio"
env = []
auto_register = true

[compatibility]
elicitate_min = "0.1.0"
