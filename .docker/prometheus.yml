# Prometheus configuration for the local docker-compose stack.
# Scrapes:
#   * itself (for self-monitoring)
#   * the OpenTelemetry collector's Prometheus exporter on :8889
#   * the phenotype-tooling CLI's `/metrics` endpoint, when the
#     `pt observability serve` subcommand is running on the host

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment_environment: local-dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: phenotype-cli
    metrics_path: /metrics
    static_configs:
      # When the CLI is launched via `docker compose run --rm pt observability serve`,
      # publish the port with: docker compose run --rm -p 9090:9090 pt ...
      - targets: ["host.docker.internal:9090"]